[package]
name = "dlr-wasm-interpreter-checked"
description = """
A wrapper for dlr-wasm-interpreter with a safe and checked interface
"""

edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
dlr-wasm-interpreter.workspace = true
dlr-wasm-interpreter-interop = { workspace = true, optional = true }
dlr-wasm-interpreter-linker = { workspace = true, optional = true }

[features]
interop = ["dlr-wasm-interpreter-interop"]
linker = ["dlr-wasm-interpreter-linker"]
