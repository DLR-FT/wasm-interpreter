[package]
name = "benchmark"
description = "Benchmarks for dlr-wasm-interpreter"

edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
dlr-wasm-interpreter.workspace = true

[dev-dependencies]
# Crates defined in our workspace
dlr-wasm-interpreter.workspace = true

# Workspace dependencies
wat.workspace = true

# Other dependencies
criterion = { version = "0.5.1", default-features = false, features = [
  "cargo_bench_support",
  "plotters",
] }
wasmi = "0.40.0"
wasmtime = { version = "27.0.0", default-features = false, features = [
  "runtime",
  "cranelift",
  "parallel-compilation",
  "std",
] }

[features]
wasmi = []
wasmtime = []

[[bench]]
name = "general_purpose"
harness = false

[[bench]]
name = "var_length_integer_reading"
harness = false

[[bench]]
name = "coremark_minimal"
harness = false
