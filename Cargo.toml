[workspace]

members = [
  "crates/benchmark",
  "crates/checked",
  "crates/compare-testsuite-rs",
  "crates/interop",
  "crates/linker",
  "crates/registry",
]
resolver = "2"

[workspace.dependencies]
dlr-wasm-interpreter = { path = "." }
dlr-wasm-interpreter-checked = { path = "crates/checked" }
dlr-wasm-interpreter-interop = { path = "crates/interop" }
dlr-wasm-interpreter-linker = { path = "crates/linker" }
dlr-wasm-interpreter-registry = { path = "crates/registry" }

env_logger = "0.10.1"
indexmap = "=2.11.4"                                   # this version has MSRV 1.63, while the next 2.12.0 jumps to MSRV 1.82
libm = "0.2.8"
log = "0.4.22"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
test-log = { version = "0.2.14", features = ["log"] }
wat = "1.0.83"


[package]
name = "dlr-wasm-interpreter"
version = "0.2.0"
edition = "2021"
rust-version = "1.87.0" # Keep this in sync with the requirements!
description = """
A WASM interpreter tailored for safety use-cases, such as automotive and avionics applications
"""
homepage = "https://github.com/DLR-FT/wasm-interpreter"
license = "MIT OR Apache-2.0"

[dependencies]
libm.workspace = true
log_wrapper.path = "crates/log_wrapper"

# libm = "=0.2.8"
# log = { version = "0.4.22", optional = true }

[dev-dependencies]
dlr-wasm-interpreter-checked = { workspace = true, features = [
  "linker",
  "interop",
] }
dlr-wasm-interpreter-interop.workspace = true
dlr-wasm-interpreter-registry.workspace = true

log.workspace = true
env_logger.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
test-log = { workspace = true, features = ["log"] }
wat.workspace = true

bumpalo = "3.17.0"
hexf = "0.2.1"
itertools = "0.14.0"
wast = "212.0.0"
regex = "1.11.1"
envconfig = "0.11.0"
lazy_static = "1.5.0"
thiserror = "2.0"

[features]
default = []

[lints.rust]
missing_docs = "allow"          # TODO change this to warn
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
private_doc_tests = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"
